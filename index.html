<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827"><title>Nexus Design — Bêta 0.0.0</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f4f6fb}*{box-sizing:border-box}body{margin:0}.top{height:64px;background:#111827;color:white;display:flex;align-items:center;justify-content:space-between;padding:0 22px;gap:12px}.brand{font-weight:800;font-size:20px;letter-spacing:-.6px}.brand b{color:#9b8cff}.beta{font-size:11px;border:1px solid #7568db;color:#c8c0ff;padding:4px 8px;border-radius:20px;margin-left:8px}.top button,.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:650;cursor:pointer}.primary{background:#7257e8;color:white}.light{background:#eef0f7;color:#29334a}.layout{display:grid;grid-template-columns:230px 1fr 250px;min-height:calc(100vh - 64px)}aside{background:white;padding:18px;border-right:1px solid #e7e9f0}.right{border-right:0;border-left:1px solid #e7e9f0}.section{font-size:11px;font-weight:800;color:#8991a4;letter-spacing:1px;margin:8px 0 14px}.tool{width:100%;display:flex;align-items:center;gap:11px;padding:12px;border:0;background:transparent;border-radius:10px;text-align:left;cursor:pointer;color:#303b52;font-weight:600}.tool:hover{background:#f1efff;color:#654bd8}.ico{width:28px;height:28px;background:#f0edff;border-radius:8px;display:grid;place-items:center;font-size:16px}.workspace{padding:24px;min-width:0}.workhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.workhead h1{font-size:18px;margin:0}.muted{color:#8790a2;font-size:13px}.stagewrap{background:#e8ebf2;border:1px solid #dfe3ed;border-radius:14px;min-height:590px;display:grid;place-items:center;padding:24px;overflow:auto}.stage{width:min(100%,760px);aspect-ratio:16/9;background:white;box-shadow:0 12px 35px #26324a20;position:relative;overflow:hidden;touch-action:pan-y}.stage svg{width:100%;height:100%;display:block;touch-action:none}.stage [data-item]{cursor:move;user-select:none}.stage [data-item].selected{filter:drop-shadow(0 0 3px #7659ee)}.panel-label{display:block;font-size:12px;font-weight:700;color:#566078;margin:18px 0 7px}.field{width:100%;padding:10px;border:1px solid #dfe3ed;border-radius:8px;font:inherit;background:white}.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}.hint{font-size:12px;color:#9299a8;line-height:1.5;margin-top:16px}.empty{color:#8b93a4;text-align:center;font-size:13px}.status{font-size:12px;color:#7d8799;margin-top:10px}.mobiletools{display:none}
@media(max-width:900px){.layout{grid-template-columns:190px 1fr}.right{display:none}.workspace{padding:14px}.stagewrap{min-height:420px;padding:12px}}
@media(max-width:600px){.top{padding:0 12px;height:58px}.brand{font-size:17px}.top .beta{display:none}.top button{padding:9px}.layout{display:block}.layout aside:first-child{display:flex;overflow:auto;padding:8px;gap:5px;border-right:0;border-bottom:1px solid #e7e9f0}.section{display:none}.tool{width:auto;white-space:nowrap;padding:8px;font-size:12px}.ico{width:24px;height:24px}.workspace{padding:12px}.workhead{align-items:flex-start}.workhead h1{font-size:16px}.stagewrap{min-height:300px;padding:8px}.hint{display:none}}
</style></head>
<body>
<header class="top"><div class="brand">✦ Nexus <b>Design</b><span class="beta">BÊTA 0.0.0</span></div><div class="row" style="flex:0 1 auto"><button class="light" id="clear">Réinitialiser</button><button class="primary" id="export">↓ Exporter PNG</button></div></header>
<div class="layout">
<aside><div class="section">CRÉATION</div>
<button class="tool" id="addText"><span class="ico">T</span> Ajouter un texte</button>
<button class="tool" id="addRect"><span class="ico">▭</span> Rectangle</button>
<button class="tool" id="addCircle"><span class="ico">◯</span> Cercle</button>
<button class="tool" id="upload"><span class="ico">▧</span> Importer une image</button><input id="file" type="file" accept="image/*" hidden>
<div class="section" style="margin-top:26px">FORMAT</div><button class="tool" id="format"><span class="ico">▣</span> Format paysage 16:9</button>
<p class="hint">Astuce : sélectionne un élément sur la page pour le déplacer ou modifier son apparence.</p></aside>
<main class="workspace"><div class="workhead"><div><h1>Mon espace de création</h1><div class="muted">Une idée devient un visuel.</div></div><div class="muted" id="count">0 élément</div></div>
<div class="stagewrap"><div class="stage" id="stage"><svg id="canvas" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#ffffff" id="bg"/><text x="800" y="410" text-anchor="middle" font-size="64" font-weight="700" fill="#c5c9d4">Votre création commence ici</text><text x="800" y="480" text-anchor="middle" font-size="30" fill="#a1a8b7">Ajoutez du texte, des formes ou une image</text></svg></div></div><div class="status" id="status">Prêt — vos créations restent dans cette session.</div></main>
<aside class="right"><div class="section">PROPRIÉTÉS</div><div id="properties" class="empty">Sélectionnez un élément pour le modifier.</div></aside>
</div>
<script>
const svg=document.getElementById('canvas'),props=document.getElementById('properties'),count=document.getElementById('count'),status=document.getElementById('status');let selected=null,drag=null,n=0;
const NS='http://www.w3.org/2000/svg';
function el(tag,attrs={}){const x=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>x.setAttribute(k,v));return x}
function clearPlaceholder(){svg.querySelectorAll('.placeholder').forEach(x=>x.remove())}
function add(tag,attrs){clearPlaceholder();const x=el(tag,attrs);x.dataset.item='1';x.dataset.id=String(++n);svg.append(x);select(x);update();return x}
function editText(x,initial='Votre texte'){const value=window.prompt('Écris ton texte :',initial);if(value===null)return false;x.textContent=value||' ';select(x);status.textContent='Texte modifié.';return true}\nfunction addText(){const x=add('text',{x:800,y:450,'text-anchor':'middle','font-size':76,'font-family':'Arial','font-weight':'700',fill:'#25233a'});x.textContent='Votre texte';if(!editText(x)){x.remove();selected=null;renderProps();update()}}
function addRect(){add('rect',{x:560,y:320,width:480,height:260,rx:24,fill:'#8065ed'})}
function addCircle(){add('circle',{cx:800,cy:450,r:150,fill:'#20b8a5'})}
function select(x){if(selected)selected.classList.remove('selected');selected=x;x.classList.add('selected');renderProps()}
function update(){const c=svg.querySelectorAll('[data-item]').length;count.textContent=c+' élément'+(c>1?'s':'');}
function renderProps(){if(!selected){props.innerHTML='<div class="empty">Sélectionnez un élément pour le modifier.</div>';return}const isText=selected.tagName==='text',isImage=selected.tagName==='image';props.innerHTML='';
const addField=(label,control)=>{const l=document.createElement('label');l.className='panel-label';l.textContent=label;props.append(l,control)};
if(isText){const inp=document.createElement('textarea');inp.className='field';inp.rows=3;inp.value=selected.textContent;inp.oninput=()=>selected.textContent=inp.value;addField('Contenu',inp)}
const color=document.createElement('input');color.type='color';color.className='field';color.value=selected.getAttribute('fill')||'#8065ed';color.oninput=()=>selected.setAttribute('fill',color.value);if(!isImage)addField('Couleur',color);
if(isText){const size=document.createElement('input');size.type='number';size.className='field';size.min=8;size.max=300;size.value=selected.getAttribute('font-size')||76;size.oninput=()=>selected.setAttribute('font-size',size.value);addField('Taille du texte',size)}
const del=document.createElement('button');del.className='btn light';del.style.width='100%';del.style.marginTop='22px';del.textContent='Supprimer l’élément';del.onclick=()=>{selected.remove();selected=null;renderProps();update()};props.append(del)}
svg.addEventListener('dblclick',e=>{const target=e.target.closest('[data-item]');if(target&&target.tagName==='text'){e.preventDefault();editText(target,target.textContent)}});\nsvg.addEventListener('pointerdown',e=>{const target=e.target.closest('[data-item]');if(!target)return;select(target);const p=point(e);drag={x:p.x,y:p.y,el:target,attrs:{x:target.getAttribute('x'),y:target.getAttribute('y'),cx:target.getAttribute('cx'),cy:target.getAttribute('cy'),x0:target.getAttribute('x'),y0:target.getAttribute('y')}};svg.setPointerCapture(e.pointerId)});
svg.addEventListener('pointermove',e=>{if(!drag)return;const p=point(e),dx=p.x-drag.x,dy=p.y-drag.y,x=drag.el,a=drag.attrs;if(x.hasAttribute('x'))x.setAttribute('x',+a.x+dx);if(x.hasAttribute('y'))x.setAttribute('y',+a.y+dy);if(x.hasAttribute('cx'))x.setAttribute('cx',+a.cx+dx);if(x.hasAttribute('cy'))x.setAttribute('cy',+a.cy+dy);if(x.tagName==='image'){x.setAttribute('x',+a.x+dx);x.setAttribute('y',+a.y+dy)}});
svg.addEventListener('pointerup',()=>drag=null);function point(e){const r=svg.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*1600,y:(e.clientY-r.top)/r.height*900}}
svg.addEventListener('click',e=>{if(e.target===svg||e.target.id==='bg'){if(selected)selected.classList.remove('selected');selected=null;renderProps()}});
document.getElementById('addText').onclick=addText;document.getElementById('addRect').onclick=addRect;document.getElementById('addCircle').onclick=addCircle;
document.getElementById('upload').onclick=()=>document.getElementById('file').click();
document.getElementById('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{const im=add('image',{href:reader.result,x:450,y:250,width:700,height:400,preserveAspectRatio:'xMidYMid meet'});im.setAttributeNS('http://www.w3.org/1999/xlink','href',reader.result)};reader.readAsDataURL(f);e.target.value=''};
document.getElementById('clear').onclick=()=>{if(!confirm('Effacer toute la création ?'))return;svg.querySelectorAll('[data-item]').forEach(x=>x.remove());selected=null;props.innerHTML='<div class="empty">Sélectionnez un élément pour le modifier.</div>';update();status.textContent='Espace réinitialisé.'};
document.getElementById('format').onclick=()=>status.textContent='Format actuel : paysage 16:9 (1600 × 900).';
document.getElementById('export').onclick=()=>{if(selected)selected.classList.remove('selected');const clone=svg.cloneNode(true);clone.setAttribute('xmlns',NS);const data=new XMLSerializer().serializeToString(clone),url=URL.createObjectURL(new Blob([data],{type:'image/svg+xml;charset=utf-8'}));const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=1600;c.height=900;c.getContext('2d').drawImage(img,0,0);URL.revokeObjectURL(url);c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='nexus-design.png';a.click();URL.revokeObjectURL(a.href);status.textContent='Export PNG terminé.'})};img.onerror=()=>{URL.revokeObjectURL(url);status.textContent='Export impossible pour cet élément.'};img.src=url};
</script></body></html>
